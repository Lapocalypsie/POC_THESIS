# Topologie du reseau: 1 orderer (operateur technique) + 5 peers (un par
# institution) + 1 conteneur CLI d'administration. Chaque peer detient sa copie
# complete du ledger (blockchain + world state) - la replication du golden record.

name: dvp-poc

networks:
  dvp:
    name: dvp-network

# Volumes nommes: le ledger de chaque noeud survit a la recreation du
# conteneur (crash Docker, modification du compose). Un "compose down -v"
# reste le geste de remise a zero.
volumes:
  orderer-data:
  centralbank-data:
  csd-data:
  banka-data:
  bankb-data:
  supervisor-data:

services:
  orderer.infra.dvp.poc:
    image: hyperledger/fabric-orderer:2.5
    restart: unless-stopped
    container_name: orderer.infra.dvp.poc
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=InfraMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /var/hyperledger/orderer
    command: orderer
    volumes:
      - ./crypto/ordererOrganizations/infra.dvp.poc/orderers/orderer.infra.dvp.poc/msp:/var/hyperledger/orderer/msp
      - ./crypto/ordererOrganizations/infra.dvp.poc/orderers/orderer.infra.dvp.poc/tls:/var/hyperledger/orderer/tls
      - orderer-data:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - dvp

  peer0.centralbank.dvp.poc:
    image: hyperledger/fabric-peer:2.5
    restart: unless-stopped
    container_name: peer0.centralbank.dvp.poc
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=dvp-network
      - CORE_PEER_ID=peer0.centralbank.dvp.poc
      - CORE_PEER_ADDRESS=peer0.centralbank.dvp.poc:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.centralbank.dvp.poc:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.centralbank.dvp.poc:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.centralbank.dvp.poc:7051
      - CORE_PEER_LOCALMSPID=CentralBankMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    working_dir: /root
    command: peer node start
    volumes:
      # docker.sock.raw: socket direct de Docker Desktop - le socket proxifie
      # casse (broken pipe) sur les builds d'images de chaincode.
      - /var/run/docker.sock.raw:/host/var/run/docker.sock
      - ./crypto/peerOrganizations/centralbank.dvp.poc/peers/peer0.centralbank.dvp.poc/msp:/etc/hyperledger/fabric/msp
      - ./crypto/peerOrganizations/centralbank.dvp.poc/peers/peer0.centralbank.dvp.poc/tls:/etc/hyperledger/fabric/tls
      - centralbank-data:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - dvp

  peer0.csd.dvp.poc:
    image: hyperledger/fabric-peer:2.5
    restart: unless-stopped
    container_name: peer0.csd.dvp.poc
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=dvp-network
      - CORE_PEER_ID=peer0.csd.dvp.poc
      - CORE_PEER_ADDRESS=peer0.csd.dvp.poc:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.csd.dvp.poc:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.csd.dvp.poc:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.csd.dvp.poc:8051
      - CORE_PEER_LOCALMSPID=CSDMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    working_dir: /root
    command: peer node start
    volumes:
      # docker.sock.raw: socket direct de Docker Desktop - le socket proxifie
      # casse (broken pipe) sur les builds d'images de chaincode.
      - /var/run/docker.sock.raw:/host/var/run/docker.sock
      - ./crypto/peerOrganizations/csd.dvp.poc/peers/peer0.csd.dvp.poc/msp:/etc/hyperledger/fabric/msp
      - ./crypto/peerOrganizations/csd.dvp.poc/peers/peer0.csd.dvp.poc/tls:/etc/hyperledger/fabric/tls
      - csd-data:/var/hyperledger/production
    ports:
      - "8051:8051"
    networks:
      - dvp

  peer0.banka.dvp.poc:
    image: hyperledger/fabric-peer:2.5
    restart: unless-stopped
    container_name: peer0.banka.dvp.poc
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=dvp-network
      - CORE_PEER_ID=peer0.banka.dvp.poc
      - CORE_PEER_ADDRESS=peer0.banka.dvp.poc:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka.dvp.poc:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka.dvp.poc:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka.dvp.poc:9051
      - CORE_PEER_LOCALMSPID=BankAMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    working_dir: /root
    command: peer node start
    volumes:
      # docker.sock.raw: socket direct de Docker Desktop - le socket proxifie
      # casse (broken pipe) sur les builds d'images de chaincode.
      - /var/run/docker.sock.raw:/host/var/run/docker.sock
      - ./crypto/peerOrganizations/banka.dvp.poc/peers/peer0.banka.dvp.poc/msp:/etc/hyperledger/fabric/msp
      - ./crypto/peerOrganizations/banka.dvp.poc/peers/peer0.banka.dvp.poc/tls:/etc/hyperledger/fabric/tls
      - banka-data:/var/hyperledger/production
    ports:
      - "9051:9051"
    networks:
      - dvp

  peer0.bankb.dvp.poc:
    image: hyperledger/fabric-peer:2.5
    restart: unless-stopped
    container_name: peer0.bankb.dvp.poc
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=dvp-network
      - CORE_PEER_ID=peer0.bankb.dvp.poc
      - CORE_PEER_ADDRESS=peer0.bankb.dvp.poc:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankb.dvp.poc:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankb.dvp.poc:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankb.dvp.poc:10051
      - CORE_PEER_LOCALMSPID=BankBMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    working_dir: /root
    command: peer node start
    volumes:
      # docker.sock.raw: socket direct de Docker Desktop - le socket proxifie
      # casse (broken pipe) sur les builds d'images de chaincode.
      - /var/run/docker.sock.raw:/host/var/run/docker.sock
      - ./crypto/peerOrganizations/bankb.dvp.poc/peers/peer0.bankb.dvp.poc/msp:/etc/hyperledger/fabric/msp
      - ./crypto/peerOrganizations/bankb.dvp.poc/peers/peer0.bankb.dvp.poc/tls:/etc/hyperledger/fabric/tls
      - bankb-data:/var/hyperledger/production
    ports:
      - "10051:10051"
    networks:
      - dvp

  peer0.supervisor.dvp.poc:
    image: hyperledger/fabric-peer:2.5
    restart: unless-stopped
    container_name: peer0.supervisor.dvp.poc
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=dvp-network
      - CORE_PEER_ID=peer0.supervisor.dvp.poc
      - CORE_PEER_ADDRESS=peer0.supervisor.dvp.poc:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.supervisor.dvp.poc:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.supervisor.dvp.poc:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.supervisor.dvp.poc:11051
      - CORE_PEER_LOCALMSPID=SupervisorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    working_dir: /root
    command: peer node start
    volumes:
      # docker.sock.raw: socket direct de Docker Desktop - le socket proxifie
      # casse (broken pipe) sur les builds d'images de chaincode.
      - /var/run/docker.sock.raw:/host/var/run/docker.sock
      - ./crypto/peerOrganizations/supervisor.dvp.poc/peers/peer0.supervisor.dvp.poc/msp:/etc/hyperledger/fabric/msp
      - ./crypto/peerOrganizations/supervisor.dvp.poc/peers/peer0.supervisor.dvp.poc/tls:/etc/hyperledger/fabric/tls
      - supervisor-data:/var/hyperledger/production
    ports:
      - "11051:11051"
    networks:
      - dvp

  cli:
    image: hyperledger/fabric-tools:2.5
    restart: unless-stopped
    container_name: dvp-cli
    tty: true
    stdin_open: true
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_PEER_TLS_ENABLED=true
    working_dir: /work
    command: /bin/bash
    volumes:
      - ./crypto:/work/crypto
      - ./artifacts:/work/artifacts
      - ../chaincode:/work/chaincode
    networks:
      - dvp
