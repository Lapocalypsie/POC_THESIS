// Harnais de tests T1-T9 du PoC (memoire, chapitre 5, section 5.3).
// Tests d'integration bout-en-bout: JUnit 5 + Fabric Gateway SDK, executes
// contre le reseau reel (aucun mock). Le rapport JUnit est l'artefact de
// preuve (Figure 5.2, Annexe A); les tableaux 5.3 et 5.4 s'en deduisent.
plugins {
    id 'java'
}

group 'poc.tests'
version '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.hyperledger.fabric:fabric-gateway:1.5.1'
    testRuntimeOnly 'io.grpc:grpc-netty-shaded:1.62.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Les scenarios s'executent en sequence (T1 fournit le trade regle a T8/T9)
    maxParallelForks = 1
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat 'short'
    }
}
